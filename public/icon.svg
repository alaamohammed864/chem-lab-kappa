<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="50%" stop-color="#0c1726"/>
      <stop offset="100%" stop-color="#070e1a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Subtle crystal unit cell lines in background -->
  <path d="M176 190 L336 190 L296 140 L136 140 Z" fill="none" stroke="#1e3a5f" stroke-width="3" opacity="0.6"/>
  <path d="M136 140 L136 290 L176 340 L176 190" fill="none" stroke="#1e3a5f" stroke-width="3" opacity="0.6"/>
  <path d="M336 190 L336 340 L176 340" fill="none" stroke="#1e3a5f" stroke-width="3" opacity="0.6"/>
  <path d="M336 190 L296 140 L296 290 L136 290" fill="none" stroke="#1e3a5f" stroke-width="3" opacity="0.6"/>
  <path d="M296 290 L336 340" fill="none" stroke="#1e3a5f" stroke-width="3" opacity="0.6"/>

  <!-- Flask outline with glowing liquid -->
  <g filter="url(#glow)">
    <!-- Liquid in Flask -->
    <path d="M192 320 L320 320 L360 410 C368 428 354 446 334 446 L178 446 C158 446 144 428 152 410 Z" fill="url(#cyanGrad)" opacity="0.85"/>
    <!-- Liquid surface line and wave -->
    <path d="M192 320 Q224 310 256 320 T320 320" stroke="#a5f3fc" stroke-width="4" fill="none"/>
    <!-- Flask Glass Body -->
    <path d="M236 100 L276 100 L276 180 L372 396 C386 428 362 460 326 460 L186 460 C150 460 126 428 140 396 L236 180 Z" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Flask Rim -->
    <rect x="226" y="90" width="60" height="16" rx="8" fill="none" stroke="#38bdf8" stroke-width="8"/>
  </g>

  <!-- Orbital Atom rings -->
  <ellipse cx="256" cy="280" rx="140" ry="50" transform="rotate(-30 256 280)" fill="none" stroke="url(#purpleGrad)" stroke-width="4" stroke-dasharray="6 4" opacity="0.8"/>
  <ellipse cx="256" cy="280" rx="140" ry="50" transform="rotate(30 256 280)" fill="none" stroke="url(#purpleGrad)" stroke-width="4" stroke-dasharray="6 4" opacity="0.8"/>

  <!-- Crystal node spheres -->
  <circle cx="256" cy="280" r="14" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="170" cy="230" r="8" fill="#38bdf8"/>
  <circle cx="342" cy="330" r="8" fill="#818cf8"/>
  <circle cx="230" cy="390" r="6" fill="#a5f3fc"/>
  <circle cx="290" cy="380" r="7" fill="#c4b5fd"/>
</svg>
